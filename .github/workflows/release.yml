name: Release

# One native build matrix produces both the downloadable archives and the
# Linux binaries embedded in the multi-architecture container image.
on:
  push:
    tags:
      # BOTH SCHEMES. `v*` is the legacy shape and stays until the last v-named
      # release is out of support; `release/*` is the product shape
      # (release/MAJOR.MINOR.PATCH).
      #
      # IT WAS WITHHELD UNTIL THE INSTALLERS COULD READ ONE. The publish side
      # separates the tag from the version and could always have built a product
      # tag correctly — but the PUBLIC installer resolved its version from the
      # release's `tag_name`, so it could not identify a product release and would
      # have failed on one that installed fine before.
      #
      # It reads both identities now: the version comes out of the asset name and
      # the address comes out of the release document, so neither is derived from
      # the tag. That is the condition this trigger was waiting on, and
      # deployment/release_identity_test.go was rewritten to REQUIRE the pattern
      # in the same change rather than deleted.
      #
      # THE HISTORICAL TRIGGER IS GONE WITH THE SCHEME. It accepted a v-prefixed
      # tag until the products stopped publishing one; a workflow that can still
      # publish under it is a way to make a release the panel cannot read.
      - "release/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example release/4.0.0"
        required: true
        type: string
      channel:
        description: "Publication channel. auto reads it from the tag; stable and testing state it."
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - testing

permissions:
  contents: read

env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

concurrency:
  group: release-passwall-node
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve release identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      owner_lc: ${{ steps.identity.outputs.owner_lc }}
      sha: ${{ steps.identity.outputs.sha }}
      build_date: ${{ steps.identity.outputs.build_date }}
      state_schema: ${{ steps.identity.outputs.state_schema }}
      upgrade_contract: ${{ steps.identity.outputs.upgrade_contract }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      image_channel: ${{ steps.channel.outputs.images }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      # THE DEFAULT IS A PRE-RELEASE, STATED OR NOT. A release published without an
      # explicit channel goes out as one, because that is the direction a deliberate
      # promotion can correct and the one that cannot move `latest` or
      # /releases/latest — pointers consumers follow, which no later edit takes back.
      #
      # SO THE TAG TEXT NO LONGER DECIDES THE CHANNEL AT ALL. It used to:
      # `contains(tag, '-')` read a hyphen as pre-release and a plain `v*` as STABLE.
      # That made a v-tag the one publishable mistake with an unrecoverable half, and
      # it is the same legacy shape rule the product scheme had to be exempted from.
      # Publishing stable is now something a maintainer states through the input.
      #
      # The tag is still read for one thing — whether it addresses a release at all,
      # in the image-channel case — and that is about the ADDRESS, not the channel.
      #
      # It lives in setup because BOTH the release and the image job need the same
      # answer, and two places deciding a channel separately is how they disagree.
      - name: Resolve tag and owner
        id: identity
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          # THE TAG AND THE VERSION ARE DIFFERENT IDENTITIES, and this is where
          # they are told apart. A product tag is `release/4.0.0` and its version
          # is `4.0.0`; a legacy tag is both. The tag is what appears in a git
          # ref and a download URL, the version is what goes into the build
          # stamp, the archive name and the image tag. Using one for the other
          # addresses a different release — for the product scheme, an image tag
          # containing a slash is not an error, it is a DIFFERENT REPOSITORY.
          #
          # The command refuses an unpublishable tag and prints nothing on
          # stdout when it does, so a failure here cannot leave `version` empty
          # and be carried into a filename.
          version=$(go run ./deployment/cmd/release-tag "$tag")
          # Belt and braces: the command already refuses rather than printing
          # nothing, but an empty version reaching ldflags or a filename is a
          # silently wrong artifact rather than a failure.
          test -n "$version" || {
            echo 'the release tag produced no version' >&2
            exit 1
          }
          release_sha=$(git rev-parse --verify "refs/tags/${tag}^{commit}")
          if [ "$release_sha" != "$GITHUB_SHA" ]; then
            echo 'select the release tag ref; refusing to stamp a different checkout with this version' >&2
            exit 1
          fi
          # Fail closed on API errors and never rebuild/replace an already
          # published version. A failed job may be retried within its own run.
          export RELEASE_TAG="$tag"
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')
          if [ -n "$existing" ]; then
            echo 'this version is already published; use a new release tag' >&2
            exit 1
          fi
          owner_lc=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          # Successful build-job retries reuse this stamp instead of changing
          # the daemon bytes by reading a fresh clock in every build job.
          build_date=$(date -u +%FT%TZ)
          upgrade_info=$(go run ./cmd/node --upgrade-info)
          state_schema=$(printf '%s' "$upgrade_info" | jq -er '.state_schema | select(type == "number" and . > 0)')
          upgrade_contract=$(printf '%s' "$upgrade_info" | jq -er '.upgrade_contract | select(type == "number" and . > 0)')
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "owner_lc=${owner_lc}"
            echo "sha=${release_sha}"
            echo "build_date=${build_date}"
            echo "state_schema=${state_schema}"
            echo "upgrade_contract=${upgrade_contract}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the publication channel
        id: channel
        shell: bash
        env:
          REQUESTED: ${{ inputs.channel }}
          PINNED_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          case "${REQUESTED:-auto}" in
            stable)  prerelease=false ;;
            testing) prerelease=true ;;
            auto)    prerelease=true ;;
            *) echo "unknown publication channel: ${REQUESTED}" >&2; exit 1 ;;
          esac
          # Which tags do images get published for at all? The legacy form and the
          # product namespace; anything else is a scratch dispatch.
          case "$PINNED_TAG" in
            v*|release/*) images=true ;;
            *)            images=false ;;
          esac
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "images=${images}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: ""     }
          - { goos: linux,   goarch: arm64, ext: ""     }
          - { goos: darwin,  goarch: amd64, ext: ""     }
          - { goos: darwin,  goarch: arm64, ext: ""     }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/setup-go@v6
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Build daemon
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.setup.outputs.version }}
          COMMIT: ${{ needs.setup.outputs.sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -euo pipefail
          mkdir -p out
          short_sha="${COMMIT:0:7}"
          ldflags="-s -w"
          ldflags+=" -X github.com/KazuhaHub/passwall-node/v4/internal/version.Version=${VERSION}"
          ldflags+=" -X github.com/KazuhaHub/passwall-node/v4/internal/version.Commit=${short_sha}"
          ldflags+=" -X github.com/KazuhaHub/passwall-node/v4/internal/version.BuildDate=${BUILD_DATE}"
          go build -trimpath -ldflags="${ldflags}" \
            -o "out/passwall-node${{ matrix.ext }}" ./cmd/node
          sh deployment/check-build.sh "out/passwall-node${{ matrix.ext }}" "$GOOS" "$GOARCH" "$COMMIT"
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: passwall-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/passwall-node${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, build]
    # The private signing key is scoped to this protected environment. Approve
    # only after reviewing the exact tag plus signing code/workflow diff;
    # release assets remain unusable by native auto-upgrade until this job
    # signs their manifest.
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/setup-go@v6
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: passwall-node-*
      - name: Package archives and checksums
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build dist
          for dir in artifacts/passwall-node-*; do
            platform="${dir#artifacts/passwall-node-}"
            goos="${platform%-*}"
            goarch="${platform##*-}"
            package="passwall-node_${VERSION}_${goos}_${goarch}"
            package_dir="build/${package}"
            mkdir -p "$package_dir"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            cp "${dir}/passwall-node${ext}" "${package_dir}/passwall-node${ext}"
            chmod +x "${package_dir}/passwall-node${ext}" || true
            cp LICENSE NOTICE README.md HANDOFF.md compose.example.yaml install.sh "${package_dir}/"
            mkdir -p "${package_dir}/deployment"
            cp deployment/install.sh "${package_dir}/deployment/"
            if [ "$goos" = "windows" ]; then
              (cd build && zip -qr "../dist/${package}.zip" "$package")
            else
              tar -C build -czf "dist/${package}.tar.gz" "$package"
            fi
          done
          # THE TEMPLATE IS PUBLISHED BY ITSELF, SIGNED WITH EVERYTHING ELSE.
          # The panel renders it for the install command it hands an operator, and
          # it needs the bytes a release published rather than a copy compiled into
          # this module — that copy is what keeps this module in the panel's
          # dependency graph, which is the dependency X07 removes.
          #
          # IT IS COPIED BEFORE THE MANIFEST IS WRITTEN, and the order is the whole
          # property: `sha256sum -- *` hashes what is in dist/ when it runs, and the
          # release signature covers that manifest and nothing else. A copy made
          # after it would publish an asset the signature does not cover.
          cp deployment/install.sh "dist/passwall-node-install-template.sh"
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
      - name: Sign checksum manifest
        shell: bash
        env:
          PN_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.PN_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          go run ./deployment/cmd/sign-release \
            -manifest dist/SHA256SUMS.txt \
            -output dist/SHA256SUMS.txt.sig
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          target_commitish: ${{ needs.setup.outputs.sha }}
          name: ${{ needs.setup.outputs.tag }}
          # Resolved once in setup, where the reason for each answer is written
          # down; both this job and the image job read that one answer.
          prerelease: ${{ needs.setup.outputs.prerelease }}
          generate_release_notes: true
          overwrite_files: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - name: Download linux/amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: passwall-node-linux-amd64
          path: bin/linux-amd64
      - name: Download linux/arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: passwall-node-linux-arm64
          path: bin/linux-arm64
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.setup.outputs.owner_lc }}/passwall-node
          tags: |
            # THE EXACT IMAGE TAG IS THE VERSION, NOT THE GIT TAG. A product tag
            # contains a slash, and a slash in a Docker tag is not rejected — it
            # is read as a REPOSITORY separator, so `passwall-node:release/4.0.0`
            # addresses a repository named `passwall-node/release`. The build
            # would succeed and push to somewhere nobody is watching.
            type=raw,value=${{ needs.setup.outputs.version }}
            # AND THE CHANNEL IS RESOLVED, NOT READ OFF THE TAG TEXT. Both of
            # these used to test `startsWith(tag, 'v')`, which a product tag has
            # no prefix for — so neither pointer would have moved. They read the
            # one answer setup resolved, which is also the answer the release's
            # prerelease flag uses, so the two cannot disagree.
            type=raw,value=latest,enable=${{ needs.setup.outputs.image_channel == 'true' && needs.setup.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ needs.setup.outputs.image_channel == 'true' }}
          labels: |
            org.opencontainers.image.title=passwall-node
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.setup.outputs.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            io.kazuhahub.passwall-node.state-schema=${{ needs.setup.outputs.state_schema }}
            io.kazuhahub.passwall-node.upgrade-contract=${{ needs.setup.outputs.upgrade_contract }}
      - name: Refuse an already published exact image tag
        env:
          IMAGE_REPOSITORY: ${{ needs.setup.outputs.owner_lc }}/passwall-node
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: node deployment/check-image.mjs "$IMAGE_REPOSITORY" "$RELEASE_VERSION"
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.setup.outputs.version }}
            STATE_SCHEMA=${{ needs.setup.outputs.state_schema }}
            UPGRADE_CONTRACT=${{ needs.setup.outputs.upgrade_contract }}
          provenance: false
