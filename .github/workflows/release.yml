name: Release

# One native build matrix produces both the downloadable archives and the
# Linux binaries embedded in the multi-architecture container image.
on:
  push:
    tags:
      # ONE NAMESPACE, AND IT IS THE ONE THE MODULE WEARS TOO: a release tag is
      # `vMAJOR.MINOR.PATCH[.BUILD]`. `release/*` is where the four releases from
      # before the address changed live; a published tag cannot be moved, so
      # nothing new is written there and this workflow no longer triggers on one.
      #
      # THE v-PREFIXED TRIGGER WAS REFUSED FOR A REASON THAT IS GONE. Every release
      # used to push a `v`-prefixed GO MODULE tag BESIDE its product tag — `v4.0.1`
      # for `release/4.0.1`, because a module whose path ends in /vMAJOR accepts only
      # vMAJOR.* — so a `v*` trigger would have fired a whole release off a tag that
      # is not one. The two identities are the same string now (the module path
      # carries the product major, which is what #51 arranged), so one tag names
      # both and there is no second tag to mistake for a release.
      #
      # AND EVERY READER TAKES THIS SHAPE OR BOTH. The public installer reads the
      # version out of the asset name and the address out of the release document;
      # the panel parses a tag under either namespace, because the four published
      # before the change are still offered; and the upgrade path in this repository
      # asks for the current address first and the historical one second, because a
      # node holds only a version. deployment/release_identity_test.go REQUIRES this
      # pattern in the same change rather than being deleted.
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v4.0.1.3"
        required: true
        type: string
      channel:
        description: "Publication channel. auto reads it from the tag; stable and testing state it."
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - testing

permissions:
  contents: read

env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

concurrency:
  group: release-passwall-node
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve release identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      owner_lc: ${{ steps.identity.outputs.owner_lc }}
      sha: ${{ steps.identity.outputs.sha }}
      build_date: ${{ steps.identity.outputs.build_date }}
      state_schema: ${{ steps.identity.outputs.state_schema }}
      upgrade_contract: ${{ steps.identity.outputs.upgrade_contract }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      image_channel: ${{ steps.channel.outputs.images }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          # NO SHARED CACHE IN A PUBLISHING RUN, in any of this workflow's jobs.
          # setup-go's entry is keyed on go.sum and written by whichever main
          # push saves it first (test.yml, core-acceptance.yml), and a tag run
          # restores it. Go trusts what it finds there: the module cache is
          # checked against go.sum only when a module is downloaded, and a build
          # object is trusted by its action ID. So one compromised step on a
          # main push could plant code that is then compiled into the six signed
          # binaries, the image, and sign-release while it holds the key. The
          # panel and SAP closed the same path, and
          # deployment/release_cache_test.go keeps this one closed. It costs
          # little: the entry held the modules and darwin/arm64's objects, and
          # the other five legs compiled from source anyway (18-32s).
          cache: false
      # THE DEFAULT IS A PRE-RELEASE, STATED OR NOT. A release published without an
      # explicit channel goes out as one, because that is the direction a deliberate
      # promotion can correct and the one that cannot move `latest` or
      # /releases/latest — pointers consumers follow, which no later edit takes back.
      #
      # SO THE TAG TEXT NO LONGER DECIDES THE CHANNEL AT ALL. It used to:
      # `contains(tag, '-')` read a hyphen as pre-release and a plain `v*` as STABLE.
      # That made a v-tag the one publishable mistake with an unrecoverable half, and
      # it is the same legacy shape rule the product scheme had to be exempted from.
      # Publishing stable is now something a maintainer states through the input.
      #
      # The tag is still read for one thing — whether it addresses a release at all,
      # in the image-channel case — and that is about the ADDRESS, not the channel.
      #
      # It lives in setup because BOTH the release and the image job need the same
      # answer, and two places deciding a channel separately is how they disagree.
      - name: Resolve tag and owner
        id: identity
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          # THE TAG AND THE VERSION ARE DIFFERENT IDENTITIES, and this is where
          # they are told apart. A product tag is `v4.0.0` and its version is
          # `4.0.0`; under the legacy scheme the tag WAS the version. The tag is
          # what appears in a git ref and a download URL, the version is what goes
          # into the build stamp, the archive name and the image tag. Using one for
          # the other addresses a different release, and the failure is quiet: an
          # image tag containing a slash is not an error to Docker, it is a
          # DIFFERENT REPOSITORY.
          #
          # The command refuses an unpublishable tag and prints nothing on
          # stdout when it does, so a failure here cannot leave `version` empty
          # and be carried into a filename.
          version=$(go run ./deployment/cmd/release-tag "$tag")
          # Belt and braces: the command already refuses rather than printing
          # nothing, but an empty version reaching ldflags or a filename is a
          # silently wrong artifact rather than a failure.
          test -n "$version" || {
            echo 'the release tag produced no version' >&2
            exit 1
          }
          release_sha=$(git rev-parse --verify "refs/tags/${tag}^{commit}")
          if [ "$release_sha" != "$GITHUB_SHA" ]; then
            echo 'select the release tag ref; refusing to stamp a different checkout with this version' >&2
            exit 1
          fi
          # Fail closed on API errors and never rebuild/replace an already
          # published version. A failed job may be retried within its own run.
          export RELEASE_TAG="$tag"
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')
          if [ -n "$existing" ]; then
            echo 'this version is already published; use a new release tag' >&2
            exit 1
          fi
          owner_lc=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          # Successful build-job retries reuse this stamp instead of changing
          # the daemon bytes by reading a fresh clock in every build job.
          build_date=$(date -u +%FT%TZ)
          upgrade_info=$(go run ./cmd/node --upgrade-info)
          state_schema=$(printf '%s' "$upgrade_info" | jq -er '.state_schema | select(type == "number" and . > 0)')
          upgrade_contract=$(printf '%s' "$upgrade_info" | jq -er '.upgrade_contract | select(type == "number" and . > 0)')
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "owner_lc=${owner_lc}"
            echo "sha=${release_sha}"
            echo "build_date=${build_date}"
            echo "state_schema=${state_schema}"
            echo "upgrade_contract=${upgrade_contract}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the publication channel
        id: channel
        shell: bash
        env:
          REQUESTED: ${{ inputs.channel }}
          PINNED_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          case "${REQUESTED:-auto}" in
            stable)  prerelease=false ;;
            testing) prerelease=true ;;
            auto)    prerelease=true ;;
            *) echo "unknown publication channel: ${REQUESTED}" >&2; exit 1 ;;
          esac
          # WHETHER THE TAG ADDRESSES A RELEASE AT ALL. Both namespaces do: the
          # current one is what every release from here on carries, and the
          # historical one is what the four published before the change carry —
          # they are real releases, and rebuilding one should publish its image
          # too. Anything else is a scratch dispatch.
          case "$PINNED_TAG" in
            v*|release/*) images=true ;;
            *)            images=false ;;
          esac
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "images=${images}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: ""     }
          - { goos: linux,   goarch: arm64, ext: ""     }
          - { goos: darwin,  goarch: amd64, ext: ""     }
          - { goos: darwin,  goarch: arm64, ext: ""     }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/setup-go@v6
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          # Published bytes never come out of a shared cache (see setup).
          cache: false
      - name: Build daemon
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.setup.outputs.version }}
          COMMIT: ${{ needs.setup.outputs.sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -euo pipefail
          mkdir -p out
          short_sha="${COMMIT:0:7}"
          ldflags="-s -w"
          ldflags+=" -X github.com/KazuhaHub/passwall-node/v4/internal/version.Version=${VERSION}"
          ldflags+=" -X github.com/KazuhaHub/passwall-node/v4/internal/version.Commit=${short_sha}"
          ldflags+=" -X github.com/KazuhaHub/passwall-node/v4/internal/version.BuildDate=${BUILD_DATE}"
          go build -trimpath -ldflags="${ldflags}" \
            -o "out/passwall-node${{ matrix.ext }}" ./cmd/node
          sh deployment/check-build.sh "out/passwall-node${{ matrix.ext }}" "$GOOS" "$GOARCH" "$COMMIT"
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: passwall-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/passwall-node${{ matrix.ext }}
          if-no-files-found: error
          # A WEEK, because both jobs that read these wait for the approval, and
          # one approval has already taken 11.8h (v4.0.1.3). Re-running failed
          # jobs does not rebuild, so a binary that expired before the approval
          # fails the approved job with no way back inside the run.
          retention-days: 7

  # NOTHING ABOVE ASKS WHETHER THE COMMIT IS ANY GOOD. Setup binds the tag to
  # the checkout and refuses a re-release; it never asked whether the commit is
  # on main, or whether Test passed on it. A tag pushed from an unmerged branch,
  # or onto a main commit whose Test failed or was cancelled, built, signed and
  # published an immutable release all the same.
  #
  # A JOB OF ITS OWN, so the build legs do not wait behind it: it runs beside
  # them, and only the two publishing jobs need it. The release job asks for its
  # approval after this passes, so a reviewer is never asked about a commit
  # whose verdict is still out.
  gate:
    name: Require a tested commit on main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0
      - name: Refuse a commit that is not on main
        shell: bash
        env:
          SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          # MAIN IS FETCHED BY NAME rather than assumed from the checkout, so the
          # answer is about main as it is now and not about whatever the checkout
          # happened to bring along.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SHA" origin/main || {
            echo "${SHA:0:7} is not on main; a release is cut from a merged commit, never from a branch" >&2
            exit 1
          }
      - name: Refuse a commit the test suite has not passed on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          # THE MAIN PUSH'S RUN, AND THE WHOLE RUN'S CONCLUSION. A pull request's
          # run tested a merge ref rather than this commit, so only the push to
          # main is a verdict on it. And `test, vet, format` aggregates the checks
          # and race jobs only; cross-compile, upgrade-systemd and the container
          # are outside it, and a release needs all of them.
          #
          # IT WAITS, BOUNDED, because the tag usually arrives first: v4.0.1.5's
          # release started 51s after Test on the same commit, which then took
          # 114s. Main runs take 82-371s; the bound is 25 minutes, above the
          # slowest Test job's own 20-minute timeout. Any other conclusion fails
          # at once. A cancelled or failed run is re-run in Test first, and then
          # this workflow's failed jobs are re-run; nothing is re-tagged.
          for _ in $(seq 1 50); do
            verdict=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml \
              --commit "$SHA" --branch main --event push --limit 1 \
              --json status,conclusion \
              --jq '.[0] | "\(.status // "none") \(.conclusion // "")"')
            case "$verdict" in
              "completed success")
                echo "Test passed on ${SHA:0:7}"
                exit 0
                ;;
              completed*)
                echo "Test on ${SHA:0:7} concluded ${verdict#completed }; re-run it, then re-run this workflow's failed jobs" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          # NO RUN AT ALL IS NOT A SLOW RUN, and re-running Test cannot help it.
          # A push runs Test on its head commit only, so a commit that was not
          # the head of its push to main, or skipped CI, never gets a verdict.
          if [ "$verdict" = "none " ]; then
            echo "no push to main ran Test on ${SHA:0:7} in 25 minutes; only the head commit of a push gets a run, so release a commit that was one" >&2
          else
            echo "Test did not finish on ${SHA:0:7} within 25 minutes (last seen: ${verdict})" >&2
          fi
          exit 1

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, build, gate]
    # The private signing key is scoped to this protected environment. Approve
    # only after reviewing the exact tag plus signing code/workflow diff;
    # release assets remain unusable by native auto-upgrade until this job
    # signs their manifest. The image job waits for this one, so the same
    # approval releases the image and moves its pointers.
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/setup-go@v6
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          # This job compiles sign-release next to the key; see setup.
          cache: false
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: passwall-node-*
      - name: Package archives and checksums
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build dist
          for dir in artifacts/passwall-node-*; do
            platform="${dir#artifacts/passwall-node-}"
            goos="${platform%-*}"
            goarch="${platform##*-}"
            package="passwall-node_${VERSION}_${goos}_${goarch}"
            package_dir="build/${package}"
            mkdir -p "$package_dir"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            cp "${dir}/passwall-node${ext}" "${package_dir}/passwall-node${ext}"
            chmod +x "${package_dir}/passwall-node${ext}" || true
            cp LICENSE NOTICE README.md HANDOFF.md compose.example.yaml install.sh "${package_dir}/"
            mkdir -p "${package_dir}/deployment"
            cp deployment/install.sh "${package_dir}/deployment/"
            if [ "$goos" = "windows" ]; then
              (cd build && zip -qr "../dist/${package}.zip" "$package")
            else
              tar -C build -czf "dist/${package}.tar.gz" "$package"
            fi
          done
          # THE TEMPLATE IS PUBLISHED BY ITSELF, SIGNED WITH EVERYTHING ELSE.
          # The panel renders it for the install command it hands an operator, and
          # it needs the bytes a release published rather than a copy compiled into
          # this module — that copy is what keeps this module in the panel's
          # dependency graph, which is the dependency X07 removes.
          #
          # IT IS COPIED BEFORE THE MANIFEST IS WRITTEN, and the order is the whole
          # property: `sha256sum -- *` hashes what is in dist/ when it runs, and the
          # release signature covers that manifest and nothing else. A copy made
          # after it would publish an asset the signature does not cover.
          cp deployment/install.sh "dist/passwall-node-install-template.sh"
          # AND THE REVIEWED CORE CATALOG, for the same reason and under the same
          # ordering rule. Which cores may be installed — the tier, the evidence
          # behind it, the REALITY compatibility table, the per-asset digests — is
          # the output of acceptance testing and is in no API; the panel needs it
          # as data, and it must be the data a release published rather than a copy
          # of this module.
          #
          # IT IS GENERATED, NOT COPIED: `publish-core-catalog` reads the catalog
          # through the same review checks the compiled one passes, so what is
          # signed is a document that has been reviewed rather than a file that
          # merely exists.
          go run ./deployment/cmd/publish-core-catalog -output dist/core-catalog.json
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
      - name: Sign checksum manifest
        shell: bash
        env:
          PN_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.PN_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          go run ./deployment/cmd/sign-release \
            -manifest dist/SHA256SUMS.txt \
            -output dist/SHA256SUMS.txt.sig
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          target_commitish: ${{ needs.setup.outputs.sha }}
          name: ${{ needs.setup.outputs.tag }}
          # Resolved once in setup, where the reason for each answer is written
          # down; both this job and the image job read that one answer.
          prerelease: ${{ needs.setup.outputs.prerelease }}
          generate_release_notes: true
          overwrite_files: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # AFTER THE SIGNED RELEASE, NOT BESIDE IT. This job has no environment, and it
  # used to need only the builds, so the image, `beta` and — on a stable
  # dispatch — `latest` moved as soon as the builds finished, before anyone
  # approved anything: v4.0.1.3's `beta` pointed for 11h46m at an image with no
  # release and no signed manifest while the approval waited. Moving a pointer
  # consumers follow is the same decision as publishing, which is why
  # promote.yml sits behind the same environment; here the image waits for the
  # approved release instead. A rejected or expired approval leaves no image
  # behind, so the re-run finds the exact tag still absent and the check below
  # lets it through.
  #
  # THE ORDER HAS A WINDOW OF ITS OWN, the harmless way round. If this job
  # fails, the release stays published with no image, and `beta` and `latest`
  # stay where they were, until the failed job is re-run. A pull of the new
  # version fails meanwhile; no pointer names an image nobody approved.
  docker:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, build, gate, release]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - name: Download linux/amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: passwall-node-linux-amd64
          path: bin/linux-amd64
      - name: Download linux/arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: passwall-node-linux-arm64
          path: bin/linux-arm64
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.setup.outputs.owner_lc }}/passwall-node
          tags: |
            # THE EXACT IMAGE TAG IS THE VERSION, NOT THE GIT TAG. They are
            # different identities, and a tag can contain characters an image tag
            # cannot mean the same thing by: a slash is not rejected by Docker — it
            # is read as a REPOSITORY separator, so `passwall-node:release/4.0.0`
            # addresses a repository named `passwall-node/release`, and the build
            # succeeds and pushes somewhere nobody is watching. That is the
            # historical namespace's shape; the current one has no slash, and the
            # rule stays because the four releases published there are still built
            # by this same job.
            type=raw,value=${{ needs.setup.outputs.version }}
            # AND THE CHANNEL IS RESOLVED, NOT READ OFF THE TAG TEXT. Both of
            # these used to test `startsWith(tag, 'v')`, which a product tag has
            # no prefix for — so neither pointer would have moved. They read the
            # one answer setup resolved, which is also the answer the release's
            # prerelease flag uses, so the two cannot disagree.
            type=raw,value=latest,enable=${{ needs.setup.outputs.image_channel == 'true' && needs.setup.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ needs.setup.outputs.image_channel == 'true' }}
          labels: |
            org.opencontainers.image.title=passwall-node
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.setup.outputs.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            io.kazuhahub.passwall-node.state-schema=${{ needs.setup.outputs.state_schema }}
            io.kazuhahub.passwall-node.upgrade-contract=${{ needs.setup.outputs.upgrade_contract }}
      - name: Refuse an already published exact image tag
        env:
          IMAGE_REPOSITORY: ${{ needs.setup.outputs.owner_lc }}/passwall-node
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: node deployment/check-image.mjs "$IMAGE_REPOSITORY" "$RELEASE_VERSION"
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.setup.outputs.version }}
            STATE_SCHEMA=${{ needs.setup.outputs.state_schema }}
            UPGRADE_CONTRACT=${{ needs.setup.outputs.upgrade_contract }}
          provenance: false
