name: Post-release acceptance

# Run against a release tag after its exact public image and packages have been
# published, on both architectures the release ships: the published container
# image is pulled and executed, and the published Linux package is installed on
# a disposable host. Neither starts the agent business loop, and neither is a
# proxy, credential or persistent-data acceptance.
#
# Disposable hosts only: the installation job consumes an already public exact
# release and mutates only new disposable GitHub-hosted VMs. Never supply real
# PSP credentials or a host.
#
# IT RUNS AFTER A RELEASE THAT A TAG PUSH STARTED, because a gate somebody has
# to remember lapsed. HANDOFF makes two-architecture package and container
# acceptance a release step; while these were dispatch-only, six releases in a
# row went out without the container one and v4.0.1.5 without the installation
# one. A Release run that completed starts it: only a successful one has pushed
# its image, since the image is the last thing Release does. workflow_run always
# runs main's copy of this file, which binds itself to the tag below exactly as a
# dispatch does.
#
# A RELEASE DISPATCHED WITH THE GITHUB TOKEN DOES NOT START IT. prepare-release.yml
# and advance-release.yml dispatch Release that way, and GitHub fires no
# workflow_run for a run those tokens started, so for those releases this has to
# be dispatched by hand before promote.yml will accept the tag. A dispatch accepts
# any published tag, from any branch, which is also how a branch's installer is
# tried against a published binary.
#
# ONE WORKFLOW, ONE RUN, FOUR JOBS: promote.yml reads that run and wants every
# job of it green.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      # THE TAG, NOT THE VERSION: a version no longer determines one address, and
      # the version is derived from the tag by the release-tag command. No
      # default, because the ones these inputs had named releases that were never
      # published under that address, and a form that fills itself in accepts the
      # wrong release.
      tag:
        description: "Published release tag, for example v4.0.1.5 or release/4.0.1.2"
        required: true
        type: string
      upgrade_from_tag:
        description: "Installation job only: older published release tag to install first, then upgrade to `tag`; empty skips the upgrade scenario"
        required: false
        default: ""
        type: string

# THE TAG IS IN THE TITLE, because the title is what promote.yml finds this
# acceptance by: a workflow_run's own ref is main, so nothing else about the run
# names the release it accepted.
run-name: Post-release acceptance of ${{ inputs.tag || github.event.workflow_run.head_branch }}

permissions:
  contents: read

env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

jobs:
  published-container:
    name: execute published image Linux/${{ matrix.arch }}
    # For a tag push, head_branch is the tag. A Release dispatch names its tag in
    # an input this event does not carry, so it is accepted by dispatching this.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      ACCEPTANCE_ARCH: ${{ matrix.arch }}
      IMAGE_REPOSITORY: ghcr.io/kazuhahub/passwall-node
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Bind harness to the exact release tag and commit
        shell: bash
        run: |
          set -euo pipefail
          # The input is the TAG, because that is what a git ref and a
          # downloadable artifact are addressed by. The accepted version is
          # what the image tag, the version label and the binary's own
          # `--version` are compared against, and it is derived once here
          # rather than re-derived per assertion.
          #
          # THE WORKFLOW IS DISPATCHED FROM A BRANCH AND BINDS ITSELF TO THE TAG.
          # It used to require dispatch FROM the tag so that GITHUB_REF and
          # GITHUB_SHA named the release -- which also meant the workflow that
          # ran was the one frozen at that tag, so the job could never be fixed
          # without cutting a new release, and a defect in it could only be
          # found by a run that could not be repaired. It resolves and checks
          # out the tag here instead, and carries that commit forward as
          # RELEASE_SHA.
          #
          # BOTH VARIABLES CROSS A STEP BOUNDARY, so they go through GITHUB_ENV:
          # a shell assignment in this step is gone by the next one, and every
          # later step reads them under `set -u`.
          git checkout --detach "refs/tags/${TAG}"
          release_sha=$(git rev-parse HEAD)
          test "$release_sha" = "$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          version=$(go run ./deployment/cmd/release-tag "$TAG")
          test -n "$version"
          {
            echo "version=$version"
            echo "RELEASE_SHA=$release_sha"
          } >> "$GITHUB_ENV"
          test "$(go env GOHOSTOS)" = linux
          test "$(go env GOHOSTARCH)" = "$ACCEPTANCE_ARCH"
          test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" { print $2 }' go.mod)"
      - name: Anonymous native pull, OCI identity and isolated executable version
        shell: bash
        run: |
          set -euo pipefail
          command -v docker > /dev/null
          # Isolate this client's authentication without modifying/logging out
          # any existing Docker configuration. No registry token is supplied.
          docker_config=$(mktemp -d "$RUNNER_TEMP/passwall-container-auth.XXXXXX")
          export DOCKER_CONFIG="$docker_config"
          test ! -e "$DOCKER_CONFIG/config.json"
          docker info > /dev/null
          image="${IMAGE_REPOSITORY}:${version}"
          docker pull --platform "linux/$ACCEPTANCE_ARCH" "$image"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "linux/$ACCEPTANCE_ARCH"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$RELEASE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" = "$version"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$image")" = Apache-2.0
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")" = "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          upgrade_info="$(docker run --rm --pull never --network none --read-only --cap-drop ALL --security-opt no-new-privileges "$image" --upgrade-info)"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.kazuhahub.passwall-node.state-schema" }}' "$image")" = "$(printf '%s' "$upgrade_info" | jq -r .state_schema)"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.kazuhahub.passwall-node.upgrade-contract" }}' "$image")" = "$(printf '%s' "$upgrade_info" | jq -r .upgrade_contract)"
          digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image")"
          case "$digest" in
            "$IMAGE_REPOSITORY"@sha256:*) ;;
            *) exit 1 ;;
          esac
          version_file="$RUNNER_TEMP/passwall-container-version-${ACCEPTANCE_ARCH}.txt"
          timeout 30s docker run --rm --pull never \
            --platform "linux/$ACCEPTANCE_ARCH" \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            "$image" --version > "$version_file"
          # Compare exact stdout bytes, including its one trailing newline.
          printf '%s (%s)\n' "$version" "${RELEASE_SHA:0:7}" | cmp - "$version_file"
          printf '%s\n' "$digest"
          cat "$version_file"
      # THE IMAGE DECLARES THE UPDATER HANDOVER PROTOCOLS ITS OWN RELEASE RECIPE
      # DOES. This is main's copy of the workflow, run against any published tag, and
      # the releases from before the label carry none, so the label cannot simply be
      # required. The workspace is the tag's tree by now, so the image is held to
      # that tree's Dockerfile.release: nothing for an older release, and never a
      # protocol its recipe did not promise — an image claiming one would let an
      # updater move onto a binary without the handover code. The answer is
      # assigned before it is compared, so a failed inspect stops the step under
      # `set -e`; `with` prints nothing for an absent label.
      - name: The image declares the updater handover protocols its release recipe does
        shell: bash
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^[[:space:]]*io\.kazuhahub\.passwall-node\.updater-handover="\([^"]*\)".*$/\1/p' Dockerfile.release)
          published=$(docker image inspect --format '{{ with index .Config.Labels "io.kazuhahub.passwall-node.updater-handover" }}{{ . }}{{ end }}' "${IMAGE_REPOSITORY}:${version}")
          test "$published" = "$declared"

  installation:
    name: systemd ${{ matrix.runner }}
    # As in the container job: head_branch is the tag of a tag push.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      UPGRADE_FROM_TAG: ${{ inputs.upgrade_from_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # THE RELEASED COMMIT, AFTER A RELEASE. workflow_run runs main's copy of
          # this file with main checked out, and the tool built below renders the
          # private installer from the checkout: main's template is not the one
          # the tag published. Empty on a dispatch, which keeps its own ref.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v6
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact pinned host and compiler toolchain
        run: |
          set -eu
          acceptance_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$acceptance_toolchain"
          test "$(go env GOVERSION)" = "$acceptance_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$acceptance_toolchain"
      - name: Build disposable installation acceptance tool
        run: go build -trimpath -o "$RUNNER_TEMP/passwall-node-installation-acceptance" ./deployment/acceptance
      - name: Derive the versions the tags name
        shell: bash
        run: |
          set -euo pipefail
          # One derivation, the one release.yml and the container job run.
          # It refuses an unpublishable tag and prints nothing when it does, so an
          # empty version cannot reach the tool. The values cross a step boundary,
          # so they go through GITHUB_ENV.
          version=$(go run ./deployment/cmd/release-tag "$TAG")
          test -n "$version"
          upgrade_from=""
          if [ -n "$UPGRADE_FROM_TAG" ]; then
            upgrade_from=$(go run ./deployment/cmd/release-tag "$UPGRADE_FROM_TAG")
            test -n "$upgrade_from"
          fi
          {
            echo "ACCEPTANCE_VERSION=$version"
            echo "ACCEPTANCE_UPGRADE_FROM=$upgrade_from"
          } >> "$GITHUB_ENV"
      - name: Install public release (upgrading first when asked), inspect isolation, rerun offline and reinstall
        shell: bash
        run: |
          set +x
          set -eu
          # BOTH IDENTITIES ARE PASSED: the tag is the address, and a release
          # published before the address changed can only be reached by naming the
          # tag it is really at; the version is what the installer verifies.
          args=(-version "$ACCEPTANCE_VERSION" -tag "$TAG")
          [ -z "${ACCEPTANCE_UPGRADE_FROM:-}" ] || args+=(-upgrade-from "$ACCEPTANCE_UPGRADE_FROM" -upgrade-from-tag "$UPGRADE_FROM_TAG")
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            "$RUNNER_TEMP/passwall-node-installation-acceptance" "${args[@]}"
      # No artifacts, raw journal, script, proc environment or diagnostics are
      # uploaded: the private fixture credential is deliberately ephemeral.
