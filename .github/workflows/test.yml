name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

# A PR push supersedes the one before it, so cancelling the older run is right
# there. A MAIN PUSH IS NOT SUPERSEDED BY THE NEXT MERGE: the group used to be
# keyed on the ref for both events, so each merge cancelled the run of the merge
# before it, and 7 of 59 main runs ended cancelled. Branch protection lets a
# tested PR merge without updating to the latest base, so that run is the only
# verdict on the merged commit, and a release tag cut from it has no other. A
# main push and a manual run get a group of their own — `github.run_id` — and
# cancel nothing.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: regular tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # THE BUILD CACHE IS PER JOB, AND setup-go's IS NOT. setup-go keys its cache
      # on go.sum alone, and a key that exists is never saved again, so every x64
      # Go job here and in the other workflows restores one entry that whichever
      # job finished first wrote once: darwin/arm64's objects, 176 MB, frozen.
      # Everything else compiles from source: the darwin/arm64 leg builds in 5s
      # and the other five targets take 18-32s, vet takes 35s, and the race job
      # spends ~47s compiling before its first result. setup-go keeps
      # `cache: true` for the module cache, which that one entry does serve.
      # Its restore lands in the same directory after this one, so every entry
      # saved here carries those darwin/arm64 objects too: quota, not correctness.
      #
      # A KEY PER JOB, because a shared key freezes whichever job saved it first.
      # RESTORED ON EVERY EVENT, SAVED ONLY FROM MAIN: a PR's cache is scoped to
      # refs/pull/N/merge, so a PR save serves only later pushes to that one PR,
      # and it costs the upload and the quota main's entries need. The save key
      # ends in the run id, because a key that exists cannot be written again,
      # and the restore picks the newest entry by prefix. A prefix restore is
      # safe because the cache is content-addressed: a stale entry can only miss.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-checks-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-go@v6
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Verify pinned build toolchain
        run: test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" { print $2 }' go.mod)"
      # THE FULL SUITE RUNS ONCE, in the race job. No file in this module is built
      # only without -race, so a plain `go test ./...` here ran the same tests a
      # second time. The named PTY test below stays: it asserts that one test ran
      # and passed, which a suite-wide pass does not.
      - name: Require named Linux PTY transfer-meter test to run and pass
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)" = linux
          command -v script > /dev/null
          go test -v ./deployment -run '^TestLinuxInstallTransferMeterOnlyOnTTY$' -count=1 -timeout=1m \
            | tee "$RUNNER_TEMP/install-pty-test.log"
          awk '
            /^--- PASS: TestLinuxInstallTransferMeterOnlyOnTTY / { passed++ }
            /^[[:space:]]*--- (SKIP|FAIL):/ { rejected++ }
            END { exit !(passed == 1 && rejected == 0) }
          ' "$RUNNER_TEMP/install-pty-test.log"
      - name: Reachable vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate immutable image publishing check
        run: node --test deployment/check_image_test.mjs
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # The build cache pair the checks job explains.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-race-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-go@v6
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race detector
        run: go test -race -count=1 -timeout=15m ./...
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  verify:
    name: test, vet, format
    if: ${{ always() }}
    needs: [checks, race]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$RACE_RESULT" = success

  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: ""     }
          - { goos: linux,   goarch: arm64, ext: ""     }
          - { goos: darwin,  goarch: amd64, ext: ""     }
          - { goos: darwin,  goarch: arm64, ext: ""     }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v6
      # The build cache pair the checks job explains, one per target: a target's
      # objects are its own, and the leg that has them builds in about 5s.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-cross-${{ matrix.goos }}-${{ matrix.goarch }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-cross-${{ matrix.goos }}-${{ matrix.goarch }}-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-go@v6
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Build daemon
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o "passwall-node${{ matrix.ext }}" ./cmd/node
          sh deployment/check-build.sh "passwall-node${{ matrix.ext }}" "$GOOS" "$GOARCH" "$GITHUB_SHA"
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-cross-${{ matrix.goos }}-${{ matrix.goarch }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  upgrade-systemd:
    name: upgrade helper sandbox (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v6
      # The build cache pair the checks job explains.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-upgrade-systemd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-upgrade-systemd-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-go@v6
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: Verify native runner architecture
        run: test "$(go env GOHOSTARCH)" = "${{ matrix.arch }}"
      - name: Run real isolated systemd permission and helper fixture acceptance
        env:
          PN_SYSTEMD_ACCEPTANCE: "1"
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./internal/upgrade -run '^TestHelper.*$|^TestUpgradeSystemd(ProcInspection|SandboxContract|DiagnosticsAreBounded)$' -count=1 -timeout=5m | tee "$RUNNER_TEMP/upgrade-systemd-tests.log"
          ! grep -Eq '^[[:space:]]*--- SKIP:' "$RUNNER_TEMP/upgrade-systemd-tests.log"
      - name: Build exact real source artifacts for upgrade and rollback E2E
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          # THE SAME THREE VERSIONS THE E2E FIXTURE DEFAULTS TO. It asserts each
          # artifact self-reports the version it was stamped with, so the two
          # lists are one decision written in two files.
          for node_version in 4.0.0 4.0.1 4.0.2; do
            go build -trimpath -ldflags="-s -w -X github.com/KazuhaHub/passwall-node/v4/internal/version.Version=$node_version -X github.com/KazuhaHub/passwall-node/v4/internal/version.Commit=abcdef1234567" \
              -o "$RUNNER_TEMP/passwall-node-e2e-$node_version" ./cmd/node
            test "$("$RUNNER_TEMP/passwall-node-e2e-$node_version" --version)" = "$node_version (abcdef1234567)"
            sh deployment/check-build.sh "$RUNNER_TEMP/passwall-node-e2e-$node_version" linux "${{ matrix.arch }}" "$GITHUB_SHA"
          done
      - name: Real Node journal recovery, authenticated readiness and start-failure rollback
        env:
          PN_NODE_UPGRADE_E2E: "1"
        shell: bash
        run: |
          set -euo pipefail
          export PN_E2E_OLD_BINARY="$RUNNER_TEMP/passwall-node-e2e-4.0.0"
          export PN_E2E_NEW_BINARY="$RUNNER_TEMP/passwall-node-e2e-4.0.1"
          export PN_E2E_FAIL_BINARY="$RUNNER_TEMP/passwall-node-e2e-4.0.2"
          export PN_E2E_SOURCE_DIR="$GITHUB_WORKSPACE"
          go test -v ./internal/upgrade -run '^TestUpgradeSystemdRealNodeE2E$' -count=1 -timeout=12m | tee "$RUNNER_TEMP/upgrade-node-e2e-tests.log"
          ! grep -Eq '^[[:space:]]*--- SKIP:' "$RUNNER_TEMP/upgrade-node-e2e-tests.log"
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-upgrade-systemd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A STAMP THAT IS NOT THE DEFAULT, or the identity check proves nothing. The
      # image used to be built with no build-args, so its label and its binary both
      # said "dev" and the check compared the Dockerfile's two defaults with each
      # other. It passed while every -X in the Dockerfile named the pre-/v4 package
      # and stamped nothing: the linker ignores a -X for a symbol it cannot find.
      IMAGE_VERSION: 4.0.0
    steps:
      - uses: actions/checkout@v6
      # NO LAYER CACHE: NOTHING IN IT IS WORTH WHAT EXPORTING IT COSTS. The one
      # expensive layer is `go build` (21-28s), and it sits after `COPY . .`, so
      # every commit rebuilds it. What the cache could restore is the golang base
      # and the module layer: that took 5.9-9.6s, and the run that missed the
      # module layer downloaded the modules in 3.9s. Exporting the cache took 12.6s
      # on a PR and 17.6-38.6s on main, and a builder that can export needed
      # setup-buildx, another 6-14s. So this is the runner's default builder,
      # which also loads the result into the local image store the checks below
      # read.
      - name: Build image
        run: docker build --build-arg VERSION="$IMAGE_VERSION" --build-arg COMMIT="$GITHUB_SHA" --tag passwall-node:test .
      # THE IMAGE THAT SHIPS IS BUILT FROM Dockerfile.release, and until this step
      # only a tag ever built it. Its runtime stage is a near-copy of Dockerfile's
      # (a diff shows the ARG handling and the COPY source), so a fix made to one
      # and not the other was proven here on the recipe that does not ship. It is
      # built the way release.yml builds it — the prebuilt linux binary under
      # bin/linux-${TARGETARCH}/, the version, schema and contract as build-args —
      # from the binary the image above already compiled, so it costs a docker cp
      # and one alpine layer (about 10s) rather than a second Go build.
      - name: Build the release recipe from the same binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin/linux-amd64
          compiled=$(docker create passwall-node:test)
          docker cp "$compiled:/usr/local/bin/passwall-node" bin/linux-amd64/passwall-node
          docker rm "$compiled" > /dev/null
          upgrade_info="$(docker run --rm passwall-node:test --upgrade-info)"
          docker build --file Dockerfile.release \
            --build-arg VERSION="$IMAGE_VERSION" \
            --build-arg STATE_SCHEMA="$(printf '%s' "$upgrade_info" | jq -er .state_schema)" \
            --build-arg UPGRADE_CONTRACT="$(printf '%s' "$upgrade_info" | jq -er .upgrade_contract)" \
            --tag passwall-node:release .
          # BuildKit picked the binary by TARGETARCH, and it is this one.
          docker run --rm --entrypoint cat passwall-node:release /usr/local/bin/passwall-node | cmp bin/linux-amd64/passwall-node -
      - name: Verify image entrypoint, build identity and project license
        run: |
          for image in passwall-node:test passwall-node:release; do
            test "$(docker run --rm "$image" --version)" = "$IMAGE_VERSION ($GITHUB_SHA)"
            upgrade_info="$(docker run --rm "$image" --upgrade-info)"
            docker run --rm --entrypoint cat "$image" /usr/share/licenses/passwall-node/LICENSE | cmp LICENSE -
            docker run --rm --entrypoint cat "$image" /usr/share/licenses/passwall-node/NOTICE | cmp NOTICE -
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$image")" = "Apache-2.0"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" = "$(printf '%s' "$upgrade_info" | jq -r .version)"
            test "$(docker image inspect --format '{{ index .Config.Labels "io.kazuhahub.passwall-node.state-schema" }}' "$image")" = "$(printf '%s' "$upgrade_info" | jq -r .state_schema)"
            test "$(docker image inspect --format '{{ index .Config.Labels "io.kazuhahub.passwall-node.upgrade-contract" }}' "$image")" = "$(printf '%s' "$upgrade_info" | jq -r .upgrade_contract)"
          done
      - name: Verify BusyBox entrypoint, started directly and from the example compose
        shell: bash
        run: |
          set -euo pipefail
          # EVERY LINE OF THE STAND-IN IS AN ASSERTION, AND `set -e` IS WHAT MAKES IT
          # ONE. Without it a failed `test` was a status nobody read and the ready
          # marker was written anyway, so none of these could fail the check. `-x`
          # puts the line that failed, with its values, in the container's log.
          cat > "$RUNNER_TEMP/fake-node" <<'SCRIPT'
          #!/bin/sh
          set -eux
          test "$(id -u):$(id -g)" = 10001:10001
          test -w /var/lib/passwall-node
          # Root keeps the runtime directory and the agent can only traverse it.
          test "$(stat -c '%u:%a' /run/passwall-node)" = "0:711"
          # THE HAND-OFF ITSELF, asserted from the side that depends on it. 0600 by the
          # service account is the one shape both ends agree on: the agent refuses a
          # credential with any group or other bit, and root here cannot write a file
          # the service account owns.
          test "$(stat -c '%u:%a' /run/passwall-node/credential)" = "10001:600"
          touch /var/lib/passwall-node/entrypoint-ready
          exec sleep 30
          SCRIPT
          chmod 0755 "$RUNNER_TEMP/fake-node"
          new_fixture() {
            mkdir -p "$1/config" "$1/data"
            printf 'pspn_%064d\n' 0 > "$1/config/node-credential.txt"
            # 0600, OWNED BY THE RUNNER'S UID — which is what the installation
            # instructions produce on any host whose installer is not root, and what a
            # NAS produces. Without this mode the check ran with a world-readable file
            # and could not see that reading the mounted credential needs DAC_OVERRIDE.
            chmod 0600 "$1/config/node-credential.txt"
          }
          # EVERY FAILURE HERE PRINTS WHAT THE CONTAINER SAID. The first version of
          # this check asserted and exited, so a red run showed the assertion and not
          # the reason — and the reason is inside the container, where the entrypoint's
          # own fatal line and the node binary's output live.
          expect_node_started() {
            local container=$1 fixture=$2
            for _ in {1..10}; do
              test -f "$fixture/data/entrypoint-ready" && break
              sleep 1
            done
            if ! test -f "$fixture/data/entrypoint-ready"; then
              echo "the entrypoint never reached the node binary; its own output follows" >&2
              docker logs "$container" >&2
              return 1
            fi
            if ! test "$(docker inspect --format '{{.State.Running}}' "$container")" = true; then
              echo "the container is not running; its own output follows" >&2
              docker logs "$container" >&2
              return 1
            fi
            docker logs "$container" > "$RUNNER_TEMP/passwall-node-container.log" 2>&1
            if grep -Fq 'find: unrecognized: -uid' "$RUNNER_TEMP/passwall-node-container.log"; then
              cat "$RUNNER_TEMP/passwall-node-container.log" >&2
              return 1
            fi
            test "$(stat -c %u:%g "$fixture/data")" = 10001:10001
            # THE COPY IS THE MOUNTED CREDENTIAL, compared by the container's root. The
            # agent cannot make this comparison, which is the point of the mode: the
            # mounted file is 0600 and belongs to the account that installed it.
            docker exec "$container" cmp /run/passwall-node/credential /run/secrets/passwall-node/node-credential.txt
          }
          trap 'docker rm -f passwall-node-direct passwall-node-agent > /dev/null 2>&1 || true' EXIT

          # STARTED FROM THE IMAGE DIRECTLY, with no tmpfs over /run/passwall-node, so
          # the entrypoint finds the service account's directory the image built and
          # has to take it back before it writes there.
          #
          # THE CAPABILITY SET IS THE COMPOSE'S, AND IT IS THE POINT OF THIS CHECK.
          # Without --cap-drop ALL the container runs with Docker's default set, which
          # includes CAP_DAC_OVERRIDE — and with it root can write into a directory it
          # has handed to PUID, so the credential copy succeeds here and fails on every
          # real installation. That is exactly how a copy that only works with
          # DAC_OVERRIDE reached a published image.
          fixture="$RUNNER_TEMP/passwall-node-container"
          new_fixture "$fixture"
          docker run -d --name passwall-node-direct --network none \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETGID --cap-add SETUID \
            -e PSP_NODE_ENDPOINT=https://panel.invalid/v1/node/sync \
            -e PSP_NODE_AGENT_ID=agt_container_entrypoint \
            -e PSP_NODE_CREDENTIAL_FILE=/run/secrets/passwall-node/node-credential.txt \
            -v "$fixture/config:/run/secrets/passwall-node:ro" \
            -v "$fixture/data:/var/lib/passwall-node" \
            -v "$RUNNER_TEMP/fake-node:/usr/local/bin/passwall-node:ro" \
            passwall-node:test > /dev/null
          expect_node_started passwall-node-direct "$fixture"

          # AND FROM compose.example.yaml ITSELF, NOT A COPY OF IT. The case above
          # carries the capability set by hand; the example also runs the agent
          # read-only, with a root-owned 0700 tmpfs over /run/passwall-node, under
          # no-new-privileges, and with the updater's marker directory, and the first
          # of those is where #58's restart loop lived. The override swaps only what CI
          # must: the image (the release recipe, which is the one operators pull) and
          # the stand-in binary. `--no-deps` leaves the updater, and its docker socket,
          # out; the marker it would write is written here, or the entrypoint would
          # wait 15s for it, longer than the loop above.
          fixture="$RUNNER_TEMP/passwall-node-compose"
          new_fixture "$fixture"
          mkdir -p "$fixture/upgrades"
          printf 'agent.upgrade.v1\n' > "$fixture/upgrades/enabled"
          cat > "$RUNNER_TEMP/compose.ci.yaml" <<YAML
          services:
            passwall-node:
              image: passwall-node:release
              volumes:
                - $RUNNER_TEMP/fake-node:/usr/local/bin/passwall-node:ro
          YAML
          NODE_VERSION="$IMAGE_VERSION" \
          PSP_NODE_ENDPOINT=https://panel.invalid/v1/node/sync \
          PSP_NODE_AGENT_ID=agt_container_compose \
            docker compose --project-directory "$fixture" \
              -f compose.example.yaml -f "$RUNNER_TEMP/compose.ci.yaml" \
              up -d --no-deps passwall-node
          expect_node_started passwall-node-agent "$fixture"
          # AND IT STARTED UNDER THE EXAMPLE'S SETTINGS, read from the kernel's side
          # rather than from what compose was asked for: a read-only root, a tmpfs
          # runtime directory, and no-new-privileges on the running node.
          test "$(docker exec passwall-node-agent awk '$2 == "/" { split($4, o, ","); print o[1] }' /proc/mounts)" = ro
          test "$(docker exec passwall-node-agent awk '$2 == "/run/passwall-node" { print $3 }' /proc/mounts)" = tmpfs
          docker exec passwall-node-agent grep -q '^NoNewPrivs:[[:space:]]*1$' /proc/1/status
