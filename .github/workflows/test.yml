name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: regular tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Verify pinned build toolchain
        run: test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" { print $2 }' go.mod)"
      - name: Unit and integration tests
        run: go test -count=1 -timeout=10m ./...
      - name: Require named Linux PTY transfer-meter test to run and pass
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)" = linux
          command -v script > /dev/null
          go test -v ./deployment -run '^TestLinuxInstallTransferMeterOnlyOnTTY$' -count=1 -timeout=1m \
            | tee "$RUNNER_TEMP/install-pty-test.log"
          awk '
            /^--- PASS: TestLinuxInstallTransferMeterOnlyOnTTY / { passed++ }
            /^[[:space:]]*--- (SKIP|FAIL):/ { rejected++ }
            END { exit !(passed == 1 && rejected == 0) }
          ' "$RUNNER_TEMP/install-pty-test.log"
      - name: Reachable vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate container entrypoint
        run: sh -n docker-entrypoint.sh
      - name: Validate immutable image publishing check
        run: node --test deployment/check_image_test.mjs

  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race detector
        run: go test -race -count=1 -timeout=15m ./...

  verify:
    name: test, vet, format
    if: ${{ always() }}
    needs: [checks, race]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$RACE_RESULT" = success

  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: ""     }
          - { goos: linux,   goarch: arm64, ext: ""     }
          - { goos: darwin,  goarch: amd64, ext: ""     }
          - { goos: darwin,  goarch: arm64, ext: ""     }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Build daemon
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o "passwall-node${{ matrix.ext }}" ./cmd/node
          sh deployment/check-build.sh "passwall-node${{ matrix.ext }}" "$GOOS" "$GOARCH" "$GITHUB_SHA"

  upgrade-systemd:
    name: upgrade helper sandbox (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: Verify native runner architecture
        run: test "$(go env GOHOSTARCH)" = "${{ matrix.arch }}"
      - name: Run real isolated systemd permission and helper fixture acceptance
        env:
          PN_SYSTEMD_ACCEPTANCE: "1"
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./internal/upgrade -run '^TestHelper.*$|^TestUpgradeSystemd(ProcInspection|SandboxContract|DiagnosticsAreBounded)$' -count=1 -timeout=5m | tee "$RUNNER_TEMP/upgrade-systemd-tests.log"
          ! grep -Eq '^[[:space:]]*--- SKIP:' "$RUNNER_TEMP/upgrade-systemd-tests.log"
      - name: Build exact real source artifacts for upgrade and rollback E2E
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          # THE SAME THREE VERSIONS THE E2E FIXTURE DEFAULTS TO. It asserts each
          # artifact self-reports the version it was stamped with, so the two
          # lists are one decision written in two files.
          for node_version in 4.0.0 4.0.1 4.0.2; do
            go build -trimpath -ldflags="-s -w -X github.com/KazuhaHub/passwall-node/v4/internal/version.Version=$node_version -X github.com/KazuhaHub/passwall-node/v4/internal/version.Commit=abcdef1234567" \
              -o "$RUNNER_TEMP/passwall-node-e2e-$node_version" ./cmd/node
            test "$("$RUNNER_TEMP/passwall-node-e2e-$node_version" --version)" = "$node_version (abcdef1234567)"
            sh deployment/check-build.sh "$RUNNER_TEMP/passwall-node-e2e-$node_version" linux "${{ matrix.arch }}" "$GITHUB_SHA"
          done
      - name: Real Node journal recovery, authenticated readiness and start-failure rollback
        env:
          PN_NODE_UPGRADE_E2E: "1"
        shell: bash
        run: |
          set -euo pipefail
          export PN_E2E_OLD_BINARY="$RUNNER_TEMP/passwall-node-e2e-4.0.0"
          export PN_E2E_NEW_BINARY="$RUNNER_TEMP/passwall-node-e2e-4.0.1"
          export PN_E2E_FAIL_BINARY="$RUNNER_TEMP/passwall-node-e2e-4.0.2"
          export PN_E2E_SOURCE_DIR="$GITHUB_WORKSPACE"
          go test -v ./internal/upgrade -run '^TestUpgradeSystemdRealNodeE2E$' -count=1 -timeout=12m | tee "$RUNNER_TEMP/upgrade-node-e2e-tests.log"
          ! grep -Eq '^[[:space:]]*--- SKIP:' "$RUNNER_TEMP/upgrade-node-e2e-tests.log"

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: passwall-node:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image entrypoint, build identity and project license
        run: |
          docker run --rm passwall-node:test --version
          upgrade_info="$(docker run --rm passwall-node:test --upgrade-info)"
          docker run --rm --entrypoint cat passwall-node:test /usr/share/licenses/passwall-node/LICENSE | cmp LICENSE -
          docker run --rm --entrypoint cat passwall-node:test /usr/share/licenses/passwall-node/NOTICE | cmp NOTICE -
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' passwall-node:test)" = "Apache-2.0"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' passwall-node:test)" = "$(printf '%s' "$upgrade_info" | jq -r .version)"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.kazuhahub.passwall-node.state-schema" }}' passwall-node:test)" = "$(printf '%s' "$upgrade_info" | jq -r .state_schema)"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.kazuhahub.passwall-node.upgrade-contract" }}' passwall-node:test)" = "$(printf '%s' "$upgrade_info" | jq -r .upgrade_contract)"
      - name: Verify BusyBox entrypoint with directory bind mounts
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/passwall-node-container"
          mkdir -p "$fixture/config" "$fixture/data"
          printf 'pspn_%064d\n' 0 > "$fixture/config/node-credential.txt"
          cat > "$fixture/fake-node" <<'SCRIPT'
          #!/bin/sh
          test "$(id -u):$(id -g)" = 10001:10001
          test -w /var/lib/passwall-node
          # THE HAND-OFF ITSELF, asserted from the side that depends on it. 0600 by the
          # service account is the one shape both ends agree on: the agent refuses a
          # credential with any group or other bit, and root here cannot write a file
          # the service account owns.
          test "$(stat -c '%u:%a' /run/passwall-node/credential)" = "10001:600"
          cmp /run/passwall-node/credential /run/secrets/passwall-node/node-credential.txt
          touch /var/lib/passwall-node/entrypoint-ready
          exec sleep 30
          SCRIPT
          chmod 0755 "$fixture/fake-node"
          # THE CAPABILITY SET IS THE COMPOSE'S, AND IT IS THE POINT OF THIS CHECK.
          # Without --cap-drop ALL the container runs with Docker's default set, which
          # includes CAP_DAC_OVERRIDE — and with it root can write into a directory it
          # has handed to PUID, so the credential copy succeeds here and fails on every
          # real installation. That is exactly how a copy that only works with
          # DAC_OVERRIDE reached a published image.
          container="$(docker run -d --network none \
            --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add SETGID --cap-add SETUID \
            -e PSP_NODE_ENDPOINT=https://panel.invalid/v1/node/sync \
            -e PSP_NODE_AGENT_ID=agt_container_entrypoint \
            -e PSP_NODE_CREDENTIAL_FILE=/run/secrets/passwall-node/node-credential.txt \
            -v "$fixture/config:/run/secrets/passwall-node:ro" \
            -v "$fixture/data:/var/lib/passwall-node" \
            -v "$fixture/fake-node:/usr/local/bin/passwall-node:ro" \
            passwall-node:test)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for _ in {1..10}; do
            test -f "$fixture/data/entrypoint-ready" && break
            sleep 1
          done
          test -f "$fixture/data/entrypoint-ready"
          test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
          docker logs "$container" > "$RUNNER_TEMP/passwall-node-container.log" 2>&1
          if grep -Fq 'find: unrecognized: -uid' "$RUNNER_TEMP/passwall-node-container.log"; then
            cat "$RUNNER_TEMP/passwall-node-container.log" >&2
            exit 1
          fi
          test "$(stat -c %u:%g "$fixture/data")" = 10001:10001
