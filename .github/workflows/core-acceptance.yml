name: Real core acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

# Same rule as test.yml, for the same reason: a PR push cancels its predecessor,
# a main push or a manual run never cancels, because it is the only verdict the
# merged commit gets.
concurrency:
  group: real-core-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-core:
    name: official cores and REALITY Linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      # The build cache pair test.yml's checks job explains: a key per job and
      # architecture, restored on every event, saved only from main.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-real-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-real-core-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-go@v7
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Require native Linux and pinned Go toolchain
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)" = linux
          test "$(go env GOHOSTARCH)" = '${{ matrix.arch }}'
          test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" { print $2 }' go.mod)"
      - name: Verify fail-closed acceptance fixture
        run: go test -count=1 ./deployment/coreacceptance
      - name: Download and execute exact official binary versions
        run: |
          set -euo pipefail
          go run ./deployment/coreacceptance prepare \
            --directory "$RUNNER_TEMP/core-acceptance" \
            --env-file "$GITHUB_ENV" | tee "$RUNNER_TEMP/core-acceptance-versions.json"
      - name: Real installer, compiled config, API wire and three-client HTTP handshake
        run: |
          set -euo pipefail
          go test -json -count=1 -timeout=10m ./internal/core/install \
            -run '^TestOfficial(Xray|SingBox)InstallIntegration$' \
            | tee "$RUNNER_TEMP/core-acceptance-tests.json"
          go test -json -count=1 -timeout=10m ./internal/core/xray \
            -run '^(TestCompilerArtifactPassesPinnedXrayValidation|TestCompilerPolicyArtifactPassesPinnedXrayValidation|TestPolicyEnforcedByRealXray|TestRealXrayCountsUsageByDomainByIPAndThroughAnAllowRule|TestRealXrayCountsAnExemptAccountsUsage|TestRealXrayCountsBulkConnectionsWithNothingUnmatched)$' \
            | tee -a "$RUNNER_TEMP/core-acceptance-tests.json"
          go test -json -count=1 -timeout=5m ./internal/core/singbox \
            -run '^(TestCompilerArtifactPassesPinnedSingBoxValidation|TestCompilerPolicyArtifactPassesPinnedSingBoxValidation|TestPolicyEnforcedByRealSingBox|TestDaemonAPIWireCompatibilityWithPinnedSingBox|TestRealityHandshakeMatrix)$' \
            | tee -a "$RUNNER_TEMP/core-acceptance-tests.json"
          go run ./deployment/coreacceptance check \
            --results "$RUNNER_TEMP/core-acceptance-tests.json"
      - name: Keep exact-version and test execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-core-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/core-acceptance-versions.json
            ${{ runner.temp }}/core-acceptance-tests.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-real-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  # THE HOST RUNNER IS GLIBC; THE IMAGE THAT SHIPS IS ALPINE (MUSL). The job above
  # proves the official cores on Ubuntu, and sing-box's plain Linux build passed it
  # while it could not start in the Docker image at all: that build is linked
  # against glibc, and exec of it on a musl host fails with ENOENT before it prints
  # a version. So the production installer runs here INSIDE the runtime image the
  # Dockerfile builds, on both architectures, downloading, checking and executing
  # the recommended Xray and sing-box exactly as a Docker-deployed node does when
  # PSP switches its engine. PSP_TEST_EXPECT_LIBC pins what the installer must
  # detect, so a detection that drifts back to glibc fails by name.
  image-cores:
    name: official cores inside the Node image Linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        # setup-go ignores the toolchain directive when its input env is local.
        # It exports local after installing the exact preferred toolchain.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Require native Linux and pinned Go toolchain
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)" = linux
          test "$(go env GOHOSTARCH)" = '${{ matrix.arch }}'
          test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" { print $2 }' go.mod)"
      - name: Build the runtime image and a static installer test binary
        run: |
          set -euo pipefail
          docker build --tag passwall-node:image-cores .
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/install.test" ./internal/core/install
      # As the image's own unprivileged user, with the root filesystem read-only
      # and only /tmp writable, the way compose.example.yaml runs the daemon.
      - name: Install and execute both official cores inside the image
        run: |
          set -euo pipefail
          docker run --rm --pull never --user 10001:10001 --read-only --tmpfs /tmp:exec,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /usr/local/bin/install.test \
            --volume "$RUNNER_TEMP/install.test:/usr/local/bin/install.test:ro" \
            --env PSP_TEST_CORE_INSTALL=1 --env PSP_TEST_SING_BOX_INSTALL=1 --env PSP_TEST_EXPECT_LIBC=musl \
            passwall-node:image-cores \
            -test.run '^TestOfficial(Xray|SingBox)InstallIntegration$' -test.count=1 -test.timeout=10m -test.v=test2json \
            | go tool test2json -p github.com/KazuhaHub/passwall-node/v4/internal/core/install \
            | tee "$RUNNER_TEMP/image-cores-tests.json"
          go run ./deployment/coreacceptance check --profile image \
            --results "$RUNNER_TEMP/image-cores-tests.json"
      - name: Keep test execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-cores-linux-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/image-cores-tests.json
          if-no-files-found: warn
          retention-days: 7
