services:
  passwall-node:
    container_name: passwall-node-agent
    image: ghcr.io/kazuhahub/passwall-node:${NODE_VERSION:?set an explicit published release version such as v1.0.0}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      passwall-node-updater:
        condition: service_started
    # The listener set is controlled dynamically by PSP, so fixed bridge-mode
    # port mappings cannot describe it. Host networking exposes exactly the
    # ports in the PSP-owned listener configuration.
    network_mode: host
    environment:
      PSP_NODE_ENDPOINT: ${PSP_NODE_ENDPOINT:?set the registered PSP HTTPS sync endpoint}
      PSP_NODE_AGENT_ID: ${PSP_NODE_AGENT_ID:?set the PSP agent id}
      PSP_NODE_DOCKER_REMOTE_UPGRADE: "true"
      PSP_NODE_CREDENTIAL_FILE: /run/secrets/passwall-node/node-credential.txt
      # Development only, for an explicitly HTTP PSP endpoint:
      PSP_NODE_ALLOW_INSECURE_HTTP: ${PSP_NODE_ALLOW_INSECURE_HTTP:-false}
    volumes:
      # Mount directories rather than individual host files. This avoids NAS
      # Compose implementations turning an absent file bind source into a
      # directory. Create ./config/node-credential.txt before first start.
      - ./config:/run/secrets/passwall-node:ro
      - ./data:/var/lib/passwall-node
      - ./upgrades:/run/passwall-node-upgrades
    labels:
      io.kazuhahub.passwall-node.managed: "true"
      io.kazuhahub.passwall-node.role: agent
      io.kazuhahub.passwall-node.agent-id: ${PSP_NODE_AGENT_ID:?set the PSP agent id}
    read_only: true
    tmpfs:
      - /run/passwall-node:size=64k,mode=0700
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    # Entrypoint-only capabilities: copy/chown the secret and state volume,
    # then switch to the configured unprivileged UID/GID before exec.
    cap_add:
      - CHOWN
      # DAC_OVERRIDE IS FOR READING THE CREDENTIAL. The installation instructions
      # chmod 0600 the credential file, and on a NAS it belongs to the account that ran
      # the install rather than to uid 0 — so the container's root is neither the owner
      # nor permitted by "other", and without this capability the copy fails with
      #
      #     cp: can't open '/run/secrets/passwall-node/node-credential.txt': Permission denied
      #
      # on every start. The alternative, a world-readable credential on the host, is
      # worse on a shared machine; this capability is used for about a second by the
      # entrypoint, which then drops to the service account permanently.
      - DAC_OVERRIDE
      # FOWNER IS NOT DECORATION. /run/passwall-node is a tmpfs, so it is
      # root-owned; the entrypoint chowns it to the service account and then
      # chmods it, and a root process that is NOT the owner needs CAP_FOWNER for
      # that chmod. Without it the container starts, prints "chmod:
      # /run/passwall-node: Operation not permitted", reports that it cannot
      # protect its runtime directory, and restarts forever.
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  # THE UPDATER FOLLOWS THE AGENT. After a remote upgrade from PSP has succeeded,
  # it moves itself onto the image the agent now runs, so it can end up on a newer
  # release than NODE_VERSION. For about fifteen seconds a second container,
  # passwall-node-updater-next-<8 hex>, runs beside it; the new one then takes
  # this name. `docker compose up -d` leaves the result alone. See "The updater
  # follows the Agent" in the README, including the one recreate an updater from
  # 4.0.1.6 or earlier needs.
  passwall-node-updater:
    container_name: passwall-node-updater
    image: ghcr.io/kazuhahub/passwall-node:${NODE_VERSION:?set an explicit published release version such as v1.0.0}
    command: ["--run-docker-upgrade-helper"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # NO NETWORK. The updater reaches the Docker Engine through its unix socket and
    # the agent through ./upgrades; the daemon, not the updater, fetches images. It
    # holds the socket, so nothing should be able to reach it.
    network_mode: none
    environment:
      PSP_NODE_UPGRADE_TARGET_CONTAINER: passwall-node-agent
      PSP_NODE_UPGRADE_TARGET_AGENT_ID: ${PSP_NODE_AGENT_ID:?set the PSP agent id}
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      # Uncomment to stop the updater following the agent; it can only switch that off.
      # PSP_NODE_UPDATER_FOLLOW_AGENT: "false"
    volumes:
      # The updater is intentionally isolated from the network-facing agent.
      # Docker socket access is root-equivalent; never add it to passwall-node.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./upgrades:/run/passwall-node-upgrades
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    # THE UPDATER RUNS AS ROOT BUT WITHOUT DAC_OVERRIDE, so the ordinary permission
    # bits apply to it, and it crosses three of them before its first heartbeat.
    # Without these its first write is refused, it exits, and the agent never
    # offers remote upgrade.
    cap_add:
      # Every file it writes is handed to PGID so the agent can read it, and root
      # is not a member of that group.
      - CHOWN
      # It reads the agent's request from ./upgrades/requests, which belongs to
      # PUID with mode 0700. Read and search only: it never writes there.
      - DAC_READ_SEARCH
      # It re-asserts that directory's 0700 on every start, a chmod on a path it
      # does not own.
      - FOWNER
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
